[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-hypergraph-slag-removal"
version = "0.1.0"
description = "Core reference implementation of digital-twin hypergraph cascade reasoning."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Bin Xiao" }
]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.1,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=7,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
